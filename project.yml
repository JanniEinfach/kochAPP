name: Lernkueche
options:
  bundleIdPrefix: de.lernkueche
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
  groupSortPosition: top

configs:
  Debug: debug
  Release: release

settings:
  base:
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_TREAT_WARNINGS_AS_ERRORS: NO
    GCC_TREAT_WARNINGS_AS_ERRORS: NO

packages:
  CoreKit:
    path: Packages/CoreKit
  DesignSystem:
    path: Packages/DesignSystem

schemes:
  Lernkueche:
    build:
      targets:
        Lernkueche: all
        LernkuecheTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - LernkuecheTests

targets:
  Lernkueche:
    type: application
    platform: iOS
    configFiles:
      Debug: App/Config/Debug.xcconfig
      Release: App/Config/Release.xcconfig
    sources:
      - path: App
        excludes:
          - "Config/**"
    dependencies:
      - package: CoreKit
        product: CoreUnits
      - package: CoreKit
        product: CoreUtilities
      - package: DesignSystem
        product: DesignSystem
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: $(PRODUCT_DISPLAY_NAME)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # Zweckbindungen. Ohne diese Texte lehnt die Pruefung den Build ab,
        # und sie muessen erklaeren wozu, nicht nur dass.
        NSCameraUsageDescription: >-
          Zum Abfotografieren von Papierrezepten und zum Dokumentieren
          deiner Arbeitsschritte.
        NSPhotoLibraryUsageDescription: >-
          Zum Hinzufügen vorhandener Fotos zu deinen Rezepten und
          Kochprotokollen.
        ITSAppUsesNonExemptEncryption: false

  LernkuecheTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: AppTests
    dependencies:
      - target: Lernkueche
      - package: DesignSystem
        product: DesignSystem
      - package: CoreKit
        product: CoreUnits
