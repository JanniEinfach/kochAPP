document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +

      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

"<!DOCTYPE html>\n<html><head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<script src=\"fa709982-31df-4f9f-98d5-e672c5180bd9\"><\u002Fscript>\n<\u002Fhead>\n<body>\n\n<x-dc>\n<helmet>\n<meta name=\"design_doc_mode\" content=\"canvas\">\n<style>\nbody{margin:0;-webkit-font-smoothing:antialiased;background:#EFEBE3;\n--sf:-apple-system,\"SF Pro Text\",system-ui,sans-serif;\n--ny:ui-serif,\"New York\",Georgia,serif}\na{color:#BD4D29;text-decoration:none}\na:hover{color:#1D1914}\n<\u002Fstyle>\n<\u002Fhelmet>\n\n<section style=\"padding:56px 56px 80px;background:#EFEBE3;color:#1D1914;font-family:var(--sf);display:flex;flex-direction:column;gap:48px;width:max-content\">\n\n  <div style=\"display:flex;align-items:flex-end;justify-content:space-between;gap:48px;width:1692px\">\n    <div style=\"flex:1;min-width:0\">\n      <div style=\"display:flex;align-items:center;gap:10px\">\n        <span style=\"font-family:var(--sf);font-size:11px;line-height:1;font-weight:700;letter-spacing:.1em;color:#FAF8F4;background:#1D1914;border-radius:6px;padding:6px 9px\">LERNKÜCHE<\u002Fspan>\n        <span style=\"font-family:var(--sf);font-size:12px;line-height:1;font-weight:600;letter-spacing:.08em;color:#736B61\">iOS 17+ · 393 × 852 PT · 19 SCREENS IN LIGHT UND DARK<\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"margin:16px 0 0;font-family:var(--ny);font-size:46px;line-height:54px;font-weight:600;letter-spacing:-1px;max-width:1240px\">Kochen und Lernen an einer Station<\u002Fdiv>\n      <p style=\"margin:14px 0 0;max-width:880px;font-family:var(--sf);font-size:17px;line-height:25px;color:#60584D;text-wrap:pretty\">Warmes Off-White als Grundfläche, Hierarchie aus Schriftgröße und Abstand statt aus Rahmen und Schatten. New York für alles Gelesene und für Zahlen mit Tabellenziffern, SF Pro für alles Bediente. Kochen trägt Terrakotta, Lernen Petrol; beide Bereiche teilen Flächen, Abstände und Bauteile.<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"display:flex;gap:9px;flex:none\">\n      <div style=\"display:flex;flex-direction:column;gap:6px;align-items:center\"><div style=\"width:34px;height:34px;border-radius:6px;background:#FAF8F4;border:1px solid rgba(29,25,20,.12)\"><\u002Fdiv><span style=\"font-family:var(--sf);font-size:10px;font-weight:600;color:#736B61\">Grund<\u002Fspan><\u002Fdiv><div style=\"display:flex;flex-direction:column;gap:6px;align-items:center\"><div style=\"width:34px;height:34px;border-radius:6px;background:#FFFEFC;border:1px solid rgba(29,25,20,.12)\"><\u002Fdiv><span style=\"font-family:var(--sf);font-size:10px;font-weight:600;color:#736B61\">erhöht<\u002Fspan><\u002Fdiv><div style=\"display:flex;flex-direction:column;gap:6px;align-items:center\"><div style=\"width:34px;height:34px;border-radius:6px;background:#F2EFE9;border:1px solid rgba(29,25,20,.12)\"><\u002Fdiv><span style=\"font-family:var(--sf);font-size:10px;font-weight:600;color:#736B61\">vertieft<\u002Fspan><\u002Fdiv><div style=\"display:flex;flex-direction:column;gap:6px;align-items:center\"><div style=\"width:34px;height:34px;border-radius:6px;background:#1D1914;border:1px solid rgba(29,25,20,.12)\"><\u002Fdiv><span style=\"font-family:var(--sf);font-size:10px;font-weight:600;color:#736B61\">Text<\u002Fspan><\u002Fdiv><div style=\"display:flex;flex-direction:column;gap:6px;align-items:center\"><div style=\"width:34px;height:34px;border-radius:6px;background:#60584D;border:1px solid rgba(29,25,20,.12)\"><\u002Fdiv><span style=\"font-family:var(--sf);font-size:10px;font-weight:600;color:#736B61\">sek.<\u002Fspan><\u002Fdiv><div style=\"display:flex;flex-direction:column;gap:6px;align-items:center\"><div style=\"width:34px;height:34px;border-radius:6px;background:#BD4D29;border:1px solid rgba(29,25,20,.12)\"><\u002Fdiv><span style=\"font-family:var(--sf);font-size:10px;font-weight:600;color:#736B61\">Kochen<\u002Fspan><\u002Fdiv><div style=\"display:flex;flex-direction:column;gap:6px;align-items:center\"><div style=\"width:34px;height:34px;border-radius:6px;background:#1B656F;border:1px solid rgba(29,25,20,.12)\"><\u002Fdiv><span style=\"font-family:var(--sf);font-size:10px;font-weight:600;color:#736B61\">Lernen<\u002Fspan><\u002Fdiv><div style=\"display:flex;flex-direction:column;gap:6px;align-items:center\"><div style=\"width:34px;height:34px;border-radius:6px;background:#8A6011;border:1px solid rgba(29,25,20,.12)\"><\u002Fdiv><span style=\"font-family:var(--sf);font-size:10px;font-weight:600;color:#736B61\">Prüfen<\u002Fspan><\u002Fdiv><div style=\"display:flex;flex-direction:column;gap:6px;align-items:center\"><div style=\"width:34px;height:34px;border-radius:6px;background:#AA2E28;border:1px solid rgba(29,25,20,.12)\"><\u002Fdiv><span style=\"font-family:var(--sf);font-size:10px;font-weight:600;color:#736B61\">Fehler<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"display:grid;grid-template-columns:repeat(4,393px);gap:32px 40px\">\n      <div style=\"display:flex;flex-direction:column;gap:12px\">\n        <div style=\"display:flex;align-items:baseline;gap:8px\"><span style=\"font-family:var(--ny);font-size:13px;line-height:1;font-weight:700;font-variant-numeric:tabular-nums;color:#736B61\">01<\u002Fspan><span style=\"font-family:var(--sf);font-size:17px;line-height:1;font-weight:600\">Rezeptdetail<\u002Fspan><span style=\"font-family:var(--sf);font-size:13px;line-height:1;font-weight:500;color:#736B61\">Light<\u002Fspan><\u002Fdiv>\n        <div style=\"width:393px;height:852px;border-radius:26px;overflow:hidden;box-shadow:0 20px 44px rgba(29,25,20,.14);--bg:#FAF8F4;--raised:#FFFEFC;--sunk:#F2EFE9;--t1:#1D1914;--t2:#60584D;--t3:#736B61;--rule:#E0DBD3;--A:#BD4D29;--ASoft:#F8E8E0;--B:#1B656F;--BSoft:#E2EFF0;--ok:#387942;--warn:#8A6011;--err:#AA2E28;--okSoft:rgba(56,121,66,.10);--warnSoft:rgba(138,96,17,.11);--errSoft:rgba(170,46,40,.09);--onA:#FFFFFF;--onB:#FFFFFF;--onWarn:#FFFFFF;--bgFade:rgba(250,248,244,0);--key:#FFFFFF;--keyBg:#D5D0C8;--keyInk:#000000;--scrim:rgba(29,25,20,.40);--paper:#FFFEFC;--paperInk:#1D1914;--paperLine:rgba(29,25,20,.20)\">\n          <dc-import name=\"RezeptDetail v2\" hint-size=\"393px,852px\"><\u002Fdc-import>\n        <\u002Fdiv>\n        <sc-if value=\"{{ specNotes }}\" hint-placeholder-val=\"{{ true }}\">\n          <p style=\"margin:0;font-family:var(--sf);font-size:13px;line-height:18px;color:#60584D;max-width:393px;text-wrap:pretty\">Mise-Streifen als Instrumentenzeile zwischen zwei Haarlinien. Eigene und externe Bewertung als zwei Spalten, getrennt und nie verrechnet. Schwierigkeit und Allergene nennen ihre Herkunft in der Warnfarbe, ohne Warnsymbol.<\u002Fp>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;gap:12px\">\n        <div style=\"display:flex;align-items:baseline;gap:8px\"><span style=\"font-family:var(--ny);font-size:13px;line-height:1;font-weight:700;font-variant-numeric:tabular-nums;color:#736B61\">02<\u002Fspan><span style=\"font-family:var(--sf);font-size:17px;line-height:1;font-weight:600\">Kochmodus · Schritt 4/8<\u002Fspan><span style=\"font-family:var(--sf);font-size:13px;line-height:1;font-weight:500;color:#736B61\">Light<\u002Fspan><\u002Fdiv>\n        <div style=\"width:393px;height:852px;border-radius:26px;overflow:hidden;box-shadow:0 20px 44px rgba(29,25,20,.14);--bg:#FAF8F4;--raised:#FFFEFC;--sunk:#F2EFE9;--t1:#1D1914;--t2:#60584D;--t3:#736B61;--rule:#E0DBD3;--A:#BD4D29;--ASoft:#F8E8E0;--B:#1B656F;--BSoft:#E2EFF0;--ok:#387942;--warn:#8A6011;--err:#AA2E28;--okSoft:rgba(56,121,66,.10);--warnSoft:rgba(138,96,17,.11);--errSoft:rgba(170,46,40,.09);--onA:#FFFFFF;--onB:#FFFFFF;--onWarn:#FFFFFF;--bgFade:rgba(250,248,244,0);--key:#FFFFFF;--keyBg:#D5D0C8;--keyInk:#000000;--scrim:rgba(29,25,20,.40);--paper:#FFFEFC;--paperInk:#1D1914;--paperLine:rgba(29,25,20,.20)\">\n          <dc-import name=\"Kochmodus v2\" hint-size=\"393px,852px\"><\u002Fdc-import>\n        <\u002Fdiv>\n        <sc-if value=\"{{ specNotes }}\" hint-placeholder-val=\"{{ true }}\">\n          <p style=\"margin:0;font-family:var(--sf);font-size:13px;line-height:18px;color:#60584D;max-width:393px;text-wrap:pretty\">Der Timer ist mit 64 pt das größte Element und schlägt den Schritttext mit 34 pt. Restzeit und Hitze stehen rechts abgesetzt, die Timer-Tasten sind 64 pt hoch.<\u002Fp>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;gap:12px\">\n        <div style=\"display:flex;align-items:baseline;gap:8px\"><span style=\"font-family:var(--ny);font-size:13px;line-height:1;font-weight:700;font-variant-numeric:tabular-nums;color:#736B61\">03<\u002Fspan><span style=\"font-family:var(--sf);font-size:17px;line-height:1;font-weight:600\">Scan-Review<\u002Fspan><span style=\"font-family:var(--sf);font-size:13px;line-height:1;font-weight:500;color:#736B61\">Light<\u002Fspan><\u002Fdiv>\n        <div style=\"width:393px;height:852px;border-radius:26px;overflow:hidden;box-shadow:0 20px 44px rgba(29,25,20,.14);--bg:#FAF8F4;--raised:#FFFEFC;--sunk:#F2EFE9;--t1:#1D1914;--t2:#60584D;--t3:#736B61;--rule:#E0DBD3;--A:#BD4D29;--ASoft:#F8E8E0;--B:#1B656F;--BSoft:#E2EFF0;--ok:#387942;--warn:#8A6011;--err:#AA2E28;--okSoft:rgba(56,121,66,.10);--warnSoft:rgba(138,96,17,.11);--errSoft:rgba(170,46,40,.09);--onA:#FFFFFF;--onB:#FFFFFF;--onWarn:#FFFFFF;--bgFade:rgba(250,248,244,0);--key:#FFFFFF;--keyBg:#D5D0C8;--keyInk:#000000;--scrim:rgba(29,25,20,.40);--paper:#FFFEFC;--paperInk:#1D1914;--paperLine:rgba(29,25,20,.20)\">\n          <dc-import name=\"ScanReview\" hint-size=\"393px,852px\"><\u002Fdc-import>\n        <\u002Fdiv>\n        <sc-if value=\"{{ specNotes }}\" hint-placeholder-val=\"{{ true }}\">\n          <p style=\"margin:0;font-family:var(--sf);font-size:13px;line-height:18px;color:#60584D;max-width:393px;text-wrap:pretty\">Original links, erkannte Zeile rechts, im selben Layout gekoppelt. Die unsichere Zeile trägt eine konkrete Übernahme-Aktion statt eines allgemeinen Hinweises.<\u002Fp>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;gap:12px\">\n        <div style=\"display:flex;align-items:baseline;gap:8px\"><span style=\"font-family:var(--ny);font-size:13px;line-height:1;font-weight:700;font-variant-numeric:tabular-nums;color:#736B61\">04<\u002Fspan><span style=\"font-family:var(--sf);font-size:17px;line-height:1;font-weight:600\">Lernküche-Start<\u002Fspan><span style=\"font-family:var(--sf);font-size:13px;line-height:1;font-weight:500;color:#736B61\">Light<\u002Fspan><\u002Fdiv>\n        <div style=\"width:393px;height:852px;border-radius:26px;overflow:hidden;box-shadow:0 20px 44px rgba(29,25,20,.14);--bg:#FAF8F4;--raised:#FFFEFC;--sunk:#F2EFE9;--t1:#1D1914;--t2:#60584D;--t3:#736B61;--rule:#E0DBD3;--A:#BD4D29;--ASoft:#F8E8E0;--B:#1B656F;--BSoft:#E2EFF0;--ok:#387942;--warn:#8A6011;--err:#AA2E28;--okSoft:rgba(56,121,66,.10);--warnSoft:rgba(138,96,17,.11);--errSoft:rgba(170,46,40,.09);--onA:#FFFFFF;--onB:#FFFFFF;--onWarn:#FFFFFF;--bgFade:rgba(250,248,244,0);--key:#FFFFFF;--keyBg:#D5D0C8;--keyInk:#000000;--scrim:rgba(29,25,20,.40);--paper:#FFFEFC;--paperInk:#1D1914;--paperLine:rgba(29,25,20,.20)\">\n          <dc-import name=\"LernHome v2\" hint-size=\"393px,852px\"><\u002Fdc-import>\n        <\u002Fdiv>\n        <sc-if value=\"{{ specNotes }}\" hint-placeholder-val=\"{{ true }}\">\n          <p style=\"margin:0;font-family:var(--sf);font-size:13px;line-height:18px;color:#60584D;max-width:393px;text-wrap:pretty\">Petrol als eigener Akzent für Lernen, gleiche Flächen und Abstände wie im Kochteil. Zwei Räume in einem Haus.<\u002Fp>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;gap:12px\">\n        <div style=\"display:flex;align-items:baseline;gap:8px\"><span style=\"font-family:var(--ny);font-size:13px;line-height:1;font-weight:700;font-variant-numeric:tabular-nums;color:#736B61\">05<\u002Fspan><span style=\"font-family:var(--sf);font-size:17px;line-height:1;font-weight:600\">Kochbuch-Home<\u002Fspan><span style=\"font-family:var(--sf);font-size:13px;line-height:1;font-weight:500;color:#736B61\">Light<\u002Fspan><\u002Fdiv>\n        <div style=\"width:393px;height:852px;border-radius:26px;overflow:hidden;box-shadow:0 20px 44px rgba(29,25,20,.14);--bg:#FAF8F4;--raised:#FFFEFC;--sunk:#F2EFE9;--t1:#1D1914;--t2:#60584D;--t3:#736B61;--rule:#E0DBD3;--A:#BD4D29;--ASoft:#F8E8E0;--B:#1B656F;--BSoft:#E2EFF0;--ok:#387942;--warn:#8A6011;--err:#AA2E28;--okSoft:rgba(56,121,66,.10);--warnSoft:rgba(138,96,17,.11);--errSoft:rgba(170,46,40,.09);--onA:#FFFFFF;--onB:#FFFFFF;--onWarn:#FFFFFF;--bgFade:rgba(250,248,244,0);--key:#FFFFFF;--keyBg:#D5D0C8;--keyInk:#000000;--scrim:rgba(29,25,20,.40);--paper:#FFFEFC;--paperInk:#1D1914;--paperLine:rgba(29,25,20,.20)\">\n          <dc-import name=\"KochbuchHome\" hint-size=\"393px,852px\"><\u002Fdc-import>\n        <\u002Fdiv>\n        <sc-if value=\"{{ specNotes }}\" hint-placeholder-val=\"{{ true }}\">\n          <p style=\"margin:0;font-family:var(--sf);font-size:13px;line-height:18px;color:#60584D;max-width:393px;text-wrap:pretty\">PromoSlot nach dem sechsten Listeneintrag mit fester Höhe. Solange keine Anzeige existiert steht dort der Fachbegriff des Tages aus einem selbst gekochten Rezept.<\u002Fp>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;gap:12px\">\n        <div style=\"display:flex;align-items:baseline;gap:8px\"><span style=\"font-family:var(--ny);font-size:13px;line-height:1;font-weight:700;font-variant-numeric:tabular-nums;color:#736B61\">06<\u002Fspan><span style=\"font-family:var(--sf);font-size:17px;line-height:1;font-weight:600\">Finden<\u002Fspan><span style=\"font-family:var(--sf);font-size:13px;line-height:1;font-weight:500;color:#736B61\">Light<\u002Fspan><\u002Fdiv>\n        <div style=\"width:393px;height:852px;border-radius:26px;overflow:hidden;box-shadow:0 20px 44px rgba(29,25,20,.14);--bg:#FAF8F4;--raised:#FFFEFC;--sunk:#F2EFE9;--t1:#1D1914;--t2:#60584D;--t3:#736B61;--rule:#E0DBD3;--A:#BD4D29;--ASoft:#F8E8E0;--B:#1B656F;--BSoft:#E2EFF0;--ok:#387942;--warn:#8A6011;--err:#AA2E28;--okSoft:rgba(56,121,66,.10);--warnSoft:rgba(138,96,17,.11);--errSoft:rgba(170,46,40,.09);--onA:#FFFFFF;--onB:#FFFFFF;--onWarn:#FFFFFF;--bgFade:rgba(250,248,244,0);--key:#FFFFFF;--keyBg:#D5D0C8;--keyInk:#000000;--scrim:rgba(29,25,20,.40);--paper:#FFFEFC;--paperInk:#1D1914;--paperLine:rgba(29,25,20,.20)\">\n          <dc-import name=\"Finden\" hint-size=\"393px,852px\"><\u002Fdc-import>\n        <\u002Fdiv>\n        <sc-if value=\"{{ specNotes }}\" hint-placeholder-val=\"{{ true }}\">\n          <p style=\"margin:0;font-family:var(--sf);font-size:13px;line-height:18px;color:#60584D;max-width:393px;text-wrap:pretty\">Herkunft doppelt codiert: Quellenzeile unter dem Titel plus eigenes Symbol. Eigene und externe Bewertung bleiben getrennt beschriftet.<\u002Fp>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;gap:12px\">\n        <div style=\"display:flex;align-items:baseline;gap:8px\"><span style=\"font-family:var(--ny);font-size:13px;line-height:1;font-weight:700;font-variant-numeric:tabular-nums;color:#736B61\">07<\u002Fspan><span style=\"font-family:var(--sf);font-size:17px;line-height:1;font-weight:600\">Scan-Kamera<\u002Fspan><span style=\"font-family:var(--sf);font-size:13px;line-height:1;font-weight:500;color:#736B61\">Light<\u002Fspan><\u002Fdiv>\n        <div style=\"width:393px;height:852px;border-radius:26px;overflow:hidden;box-shadow:0 20px 44px rgba(29,25,20,.14);--bg:#FAF8F4;--raised:#FFFEFC;--sunk:#F2EFE9;--t1:#1D1914;--t2:#60584D;--t3:#736B61;--rule:#E0DBD3;--A:#BD4D29;--ASoft:#F8E8E0;--B:#1B656F;--BSoft:#E2EFF0;--ok:#387942;--warn:#8A6011;--err:#AA2E28;--okSoft:rgba(56,121,66,.10);--warnSoft:rgba(138,96,17,.11);--errSoft:rgba(170,46,40,.09);--onA:#FFFFFF;--onB:#FFFFFF;--onWarn:#FFFFFF;--bgFade:rgba(250,248,244,0);--key:#FF rsicht\" hint-size=\"393px,852px\"><\u002Fdc-import>\n        <\u002Fdiv>\n        <sc-if value=\"{{ specNotes }}\" hint-placeholder-val=\"{{ true }}\">\n          <p style=\"margin:0;font-family:var(--sf);font-size:13px;line-height:18px;color:#60584D;max-width:393px;text-wrap:pretty\">Monat ist die Abgabeeinheit, Woche die Eingabeeinheit. Der laufende Monat ist aufgeklappt und zeigt seine vier Wochen mit Signaturstand.<\u002Fp>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;gap:12px\">\n        <div style=\"display:flex;align-items:baseline;gap:8px\"><span style=\"font-family:var(--ny);font-size:13px;line-height:1;font-weight:700;font-variant-numeric:tabular-nums;color:#736B61\">12<\u002Fspan><span style=\"font-family:var(--sf);font-size:17px;line-height:1;font-weight:600\">Wocheneintrag schreiben<\u002Fspan><span style=\"font-family:var(--sf);font-size:13px;line-height:1;font-weight:500;color:#736B61\">Light<\u002Fspan><\u002Fdiv>\n        <div style=\"width:393px;height:852px;border-radius:26px;overflow:hidden;box-shadow:0 20px 44px rgba(29,25,20,.14);--bg:#FAF8F4;--raised:#FFFEFC;--sunk:#F2EFE9;--t1:#1D1914;--t2:#60584D;--t3:#736B61;--rule:#E0DBD3;--A:#BD4D29;--ASoft:#F8E8E0;--B:#1B656F;--BSoft:#E2EFF0;--ok:#387942;--warn:#8A6011;--err:#AA2E28;--okSoft:rgba(56,121,66,.10);--warnSoft:rgba(138,96,17,.11);--errSoft:rgba(170,46,40,.09);--onA:#FFFFFF;--onB:#FFFFFF;--onWarn:#FFFFFF;--bgFade:rgba(250,248,244,0);--key:#FFFFFF;--keyBg:#D5D0C8;--keyInk:#000000;--scrim:rgba(29,25,20,.40);--paper:#FFFEFC;--paperInk:#1D1914;--paperLine:rgba(29,25,20,.20)\">\n          <dc-import name=\"BerichtsheftSchreiben\" hint-size=\"393px,852px\"><\u002Fdc-import>\n        <\u002Fdiv>\n        <sc-if value=\"{{ specNotes }}\" hint-placeholder-val=\"{{ true }}\">\n          <p style=\"margin:0;font-family:var(--sf);font-size:13px;line-height:18px;color:#60584D;max-width:393px;text-wrap:pretty\">Tätigkeiten, Unterweisungen und Berufsschule span> — fünf Stufen, immer mit Herkunft.<\u002Fdiv>\n          <div style=\"font-family:var(--sf);font-size:14px;line-height:20px;text-wrap:pretty\"><span style=\"font-family:var(--ny);font-weight:600\">Scan<\u002Fspan> — nichts wird automatisch gespeichert. Zeilen unter 0,80 Konfidenz brauchen eine explizite Bestätigung mit konkretem Vorschlag.<\u002Fdiv>\n          <div style=\"font-family:var(--sf);font-size:14px;line-height:20px;text-wrap:pretty\"><span style=\"font-family:var(--ny);font-weight:600\">Berichtsheft<\u002Fspan> — Woche ist die Eingabeeinheit, Monat die Abgabeeinheit. Signaturen und Ablehnungen sind append-only, Stunden werden als Minuten gespeichert.<\u002Fdiv>\n          <div style=\"font-family:var(--sf);font-size:14px;line-height:20px;text-wrap:pretty\"><span style=\"font-family:var(--ny);font-weight:600\">PromoSlot<\u002Fspan> — nach dem sechsten Listenelement, feste Höhe. Ohne Anzeige zeigt er Produktinhalt, nie Leerraum.<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;showDark&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Board&quot;},&quot;specNotes&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Board&quot;}}\">\nclass Component extends DCLogic {\n  renderVals() {\n    return {\n      showDark: this.props.showDark ?? false,\n      specNotes: this.props.specNotes ?? true\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
